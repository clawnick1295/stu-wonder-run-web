<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EFE3CC">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>Stu's Wonder Run</title>
<style>
:root{--trav:#EFE3CC;--ochre:#D9A441;--terra:#C2603B;--pine:#4F6B3A;--teal:#5FA8A3;--sky:#A9CBE3;--gold:#F2C94C;--ink:#4b2f5e;--card:#fff8ea}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--trav);color:var(--ink);font-family:"Trebuchet MS","Arial Rounded MT Bold","Avenir Next",Verdana,system-ui,sans-serif;line-height:1.35;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(#8fbbe0,#bcd7ec)}
.hero .art{position:relative}
.hero img.bg{display:block;width:100%;height:auto;aspect-ratio:1600/895;max-height:calc(100vh - 64px);object-fit:cover;object-position:50% 14%}
.hero .title{text-align:center;padding:12px 12px 10px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 16px;border-bottom:3px solid var(--ink)}
.hero h1{margin:0;font-size:clamp(30px,6.4vw,62px);color:var(--gold);letter-spacing:.5px;
  -webkit-text-stroke:clamp(1.5px,.35vw,3px) var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 rgba(75,47,94,.35)}
.hero p.tag{display:inline-block;margin:0;padding:6px 16px;border-radius:999px;background:rgba(255,248,234,.92);border:2px solid var(--ink);font-weight:800;font-size:clamp(14px,2.2vw,20px)}
.jump{position:absolute;right:16px;bottom:14px;display:inline-block;padding:12px 26px;border-radius:999px;background:var(--terra);color:#fff8ea;
  font-weight:800;font-size:clamp(17px,2.6vw,24px);text-decoration:none;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.jump:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
/* sections */
section{padding:26px 0 8px}
h2{font-size:clamp(24px,3.6vw,34px);margin:0 0 14px;color:var(--terra);display:flex;align-items:center;gap:10px}
h2 .dot{width:14px;height:14px;border-radius:50%;background:var(--gold);border:2px solid var(--ink);flex:none}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tile{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 0 rgba(75,47,94,.25)}
.tile .ic{flex:none;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;border:2px solid var(--ink)}
.tile b{display:block;font-size:20px}
.tile span{font-size:16px}
.ic svg{width:44px;height:44px}
.rules{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:8px 18px;margin:0;list-style:none;box-shadow:0 4px 0 rgba(75,47,94,.25)}
.rules li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;font-size:18px;border-bottom:2px dashed rgba(75,47,94,.2)}
.rules li:last-child{border-bottom:0}
.rules .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold);border:2px solid var(--ink);display:grid;place-items:center;font-weight:800}
/* picture-first How to Play */
.how{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.pic{position:relative;font:inherit;color:inherit;cursor:pointer;background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 0 rgba(75,47,94,.25)}
.pic:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(75,47,94,.25)}
.pic b{font-size:22px}
.pic .spk{position:absolute;top:8px;right:10px;font-style:normal;font-size:18px;opacity:.75}
.scene{position:relative;width:120px;height:96px;border-radius:16px;background:linear-gradient(#cfe4f3,#f6e7c8);border:2px solid var(--ink);overflow:hidden}
.scene .stu{position:absolute;left:58px;bottom:-4px;width:58px;height:auto}
.hand{position:absolute;width:26px;height:35px;left:14px;top:22px}
.hand.tap{animation:tap 1.2s ease-in-out infinite}
.hand.swipe{animation:swipe 1.3s ease-in-out infinite}
.jumpy{animation:jumpy 1.2s ease-in-out infinite}
.slidey{transform-origin:50% 50%;animation:slidey 1.3s ease-in-out infinite}
.ripple{position:absolute;left:10px;top:12px;width:18px;height:18px;border-radius:50%;border:3px solid #f2c94c;opacity:0;animation:ripple 1.2s ease-out infinite}
.arrow.down{position:absolute;left:8px;top:12px;width:4px;height:52px;background:#fff8ea;border-radius:2px;opacity:.9}
.arrow.down:after{content:"";position:absolute;left:-6px;bottom:-4px;border:8px solid transparent;border-top:10px solid #fff8ea}
.coin{position:absolute;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#f2c94c 45%,#c98a2a);border:2.5px solid var(--ink);animation:spin 1.1s linear infinite}
.c1{left:14px;top:46px}.c2{left:45px;top:22px;animation-delay:.2s}.c3{left:76px;top:46px;animation-delay:.4s}
.gem,.heart{position:absolute;left:32px;top:20px;width:56px;height:56px;animation:bob 1.6s ease-in-out infinite}
.heart{animation:beat 1s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translateY(-8px)}40%,55%{transform:translateY(0)}}
@keyframes ripple{0%,40%{opacity:0;transform:scale(.4)}50%{opacity:1}100%{opacity:0;transform:scale(1.8)}}
@keyframes jumpy{0%,45%,100%{transform:translateY(0)}70%{transform:translateY(-22px)}}
@keyframes swipe{0%{transform:translateY(-6px);opacity:0}15%{opacity:1}65%{transform:translateY(30px);opacity:1}100%{transform:translateY(30px);opacity:0}}
@keyframes slidey{0%,20%,85%,100%{transform:none}35%,70%{transform:translate(-18px,14px) rotate(-80deg) scale(.72)}}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.15)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.hand,.jumpy,.slidey,.ripple,.coin,.gem,.heart{animation:none!important}}
.say{font:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:2px 10px;font-size:20px}
.mute{position:absolute;top:10px;right:12px;z-index:2;width:44px;height:44px;border-radius:50%;font-size:22px;border:3px solid var(--ink);background:rgba(255,248,234,.95);cursor:pointer}
.hero .bankTop{position:absolute;bottom:14px;left:12px;z-index:2;display:flex;align-items:center;gap:6px;padding:4px 12px 4px 6px;border-radius:999px;border:3px solid var(--ink);background:rgba(255,248,234,.95);font-weight:900;font-size:20px;text-decoration:none}
.coinI{display:inline-block;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#f2c94c 45%,#c98a2a);border:2px solid var(--ink)}
/* closet */
.closet{display:grid;grid-template-columns:minmax(160px,230px) 1fr;gap:16px;align-items:start}
.mirror{position:relative;background:linear-gradient(#d8ecf7,#f6e7c8);border:3px solid var(--ink);border-radius:26px;padding:14px 10px 8px;box-shadow:0 6px 0 rgba(75,47,94,.3)}
.mirror canvas{display:block;width:100%;height:auto;aspect-ratio:300/460}
.bank{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:6px;padding:3px 10px 3px 5px;border-radius:999px;border:2px solid var(--ink);background:var(--card);font-weight:900;font-size:19px}
.off{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:var(--card);font-size:18px;cursor:pointer}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.item{font:inherit;color:inherit;cursor:pointer;position:relative;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 0 rgba(75,47,94,.25)}
.item canvas{width:72px;height:72px}
.item .nm{font-weight:800;font-size:14px;text-align:center;line-height:1.1}
.item .pr{display:flex;align-items:center;gap:4px;font-weight:900;font-size:17px}
.item .pr .coinI{width:18px;height:18px}
.item.sel{outline:4px solid var(--gold);outline-offset:2px}
.item.on{background:#e4f3dc}
.item .tick{position:absolute;top:6px;right:8px;font-size:18px;color:var(--pine);font-weight:900}
.item .buy{margin-top:2px;padding:6px 14px;border-radius:999px;border:2px solid var(--ink);background:var(--terra);color:#fff8ea;font-weight:900;font-size:16px;display:flex;gap:5px;align-items:center}
.item .buy[disabled]{background:#d9cfc0;color:#7d6c80}
.phone{display:inline-block;width:22px;height:36px;border:3px solid var(--ink);border-radius:6px;background:var(--terra);animation:turn 2.4s ease-in-out infinite}
@keyframes turn{0%,25%{transform:rotate(0)}55%,90%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (max-width:560px){.closet{grid-template-columns:1fr}.mirror{max-width:220px;margin:0 auto}}
/* maps */
.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.map{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:26px;overflow:hidden;box-shadow:0 6px 0 rgba(75,47,94,.3)}
.map a.main{display:block;text-decoration:none}
.map img{display:block;width:100%;height:auto;aspect-ratio:1738/690;object-fit:cover;border-bottom:3px solid var(--ink);background:var(--sky)}
.map .info{padding:12px 16px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.map h3{margin:0;font-size:28px;flex:1 1 auto}
.map .sub{display:block;font-size:15px;font-weight:600;opacity:.85}
.play{flex:none;padding:12px 24px;border-radius:999px;color:#fff8ea;font-weight:800;font-size:22px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.rio .play{background:var(--teal)} .rome .play{background:var(--terra)}
.map a.main:active .play{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.alt{display:block;margin:-4px 16px 14px;font-size:15px;font-weight:800}
.alt a{display:inline-block;padding:6px 14px;border-radius:999px;border:2px solid var(--ink);background:#e7f3f1;text-decoration:none}
.badge{position:absolute;top:10px;left:10px;padding:4px 12px;border-radius:999px;background:var(--gold);border:2px solid var(--ink);font-weight:800;font-size:15px}
footer{text-align:center;padding:26px 12px 34px;font-size:15px;opacity:.8}
.turn{display:none}
@media (orientation:portrait){.turn{display:block;margin:12px 0 0;text-align:center}
  .hero .title{flex-direction:column}
  .jump{right:10px;bottom:8px;padding:8px 18px;font-size:16px}}
/* short landscape phones: keep the hero compact */
@media (orientation:landscape) and (max-height:500px){
  .hero .title{padding:8px 12px 7px}
  .hero h1{font-size:34px}
  .hero p.tag{font-size:15px;padding:4px 14px}
  section{padding:18px 0 4px}
}
</style>
</head>
<body>
<header class="hero">
  <div class="title">
    <h1>Stu's Wonder Run</h1>
    <p class="tag">Run, jump and wonder around the world!</p>
  </div>
  <div class="art">
    <a class="bankTop" href="#closet" aria-label="Your coins"><span class="coinI"></span><span id="bankTop">0</span></a>
    <button class="mute" id="mute" aria-label="Sound on or off">&#128266;</button>
    <img class="bg" src="img/hero-960.webp" srcset="img/hero-960.webp 960w, img/hero.webp 1600w" sizes="100vw" width="1600" height="895" alt="Stu waving in front of the 7 New Wonders: Christ the Redeemer, Machu Picchu, Chichen Itza, the Great Wall, the Taj Mahal, Petra and the Colosseum" fetchpriority="high">
    <a class="jump" href="#maps">Pick a map &darr;</a>
  </div>
</header>

<main class="wrap">
  <section id="how">
    <h2><span class="dot"></span>How to Play <button class="say big" data-say="pick_map" aria-label="Hear how to play">&#128266;</button></h2>
    <div class="how">
      <button class="pic" data-say="jump" aria-label="Tap to jump">
        <span class="scene"><span class="ripple"></span><svg class="hand tap" viewBox="0 0 30 40"><rect x="10" y="1" width="8" height="20" rx="4" fill="#fffaf0" stroke="#4b2f5e" stroke-width="2.2"/><rect x="3" y="17" width="7" height="12" rx="3.5" fill="#fffaf0" stroke="#4b2f5e" stroke-width="2.2"/><ellipse cx="17" cy="26" rx="11" ry="10" fill="#fffaf0" stroke="#4b2f5e" stroke-width="2.2"/><rect x="9" y="34" width="16" height="5" rx="2" fill="#C2603B"/></svg><img class="stu jumpy" src="img/stu-stand.webp" alt=""></span><b>Jump!</b><i class="spk">&#128266;</i></button>
      <button class="pic" data-say="slide" aria-label="Swipe down to slide">
        <span class="scene"><span class="arrow down"></span><svg class="hand swipe" viewBox="0 0 30 40"><rect x="10" y="1" width="8" height="20" rx="4" fill="#fffaf0" stroke="#4b2f5e" stroke-width="2.2"/><rect x="3" y="17" width="7" height="12" rx="3.5" fill="#fffaf0" stroke="#4b2f5e" stroke-width="2.2"/><ellipse cx="17" cy="26" rx="11" ry="10" fill="#fffaf0" stroke="#4b2f5e" stroke-width="2.2"/><rect x="9" y="34" width="16" height="5" rx="2" fill="#C2603B"/></svg><img class="stu slidey" src="img/stu-stand.webp" alt=""></span><b>Slide!</b><i class="spk">&#128266;</i></button>
      <button class="pic" data-say="coins" aria-label="Grab the gold coins">
        <span class="scene"><span class="coin c1"></span><span class="coin c2"></span><span class="coin c3"></span></span><b>Coins!</b><i class="spk">&#128266;</i></button>
      <button class="pic" data-say="find_gem" aria-label="Find the magic gem">
        <span class="scene"><svg class="gem" viewBox="0 0 48 48"><path d="M24 6l14 8v20l-14 8-14-8V14z" fill="#2fae6a" stroke="#4b2f5e" stroke-width="3" stroke-linejoin="round"/><path d="M24 14l7 10-7 10-7-10z" fill="#6fd69a"/></svg></span><b>Gem!</b><i class="spk">&#128266;</i></button>
      <button class="pic" data-say="bumps_ok" aria-label="Bumps are okay, Stu never falls">
        <span class="scene"><svg class="heart" viewBox="0 0 48 48"><path d="M24 41s-15-9-15-20a8 8 0 0 1 15-4 8 8 0 0 1 15 4c0 11-15 20-15 20z" fill="#C2603B" stroke="#4b2f5e" stroke-width="3" stroke-linejoin="round"/></svg></span><b>No falling!</b><i class="spk">&#128266;</i></button>
    </div>
  </section>

  <section id="maps">
    <h2><span class="dot"></span>Pick a Map</h2>
    <div class="maps">
      <div class="map rio">
        <span class="badge">Map 1</span>
        <a class="main" href="../genesis/">
          <img src="img/thumb-rio.webp" alt="Rio de Janeiro map: Stu running on the beach" width="720" height="286">
          <div class="info"><h3>Rio de Janeiro<span class="sub">Beach to the Corcovado</span></h3><span class="play">Play &#9654;</span></div>
        </a>
      </div>
      <div class="map rome">
        <span class="badge">Map 2</span>
        <a class="main" href="rome/">
          <img src="img/thumb-rome.webp" alt="Rome map: Stu at the Trevi Fountain" width="720" height="286">
          <div class="info"><h3>Roma<span class="sub">Spanish Steps to the Colosseum</span></h3><span class="play">Play &#9654;</span></div>
        </a>
      </div>
    </div>
    <p class="turn"><span class="phone"></span></p>
  </section>

  <section id="closet">
    <h2><span class="dot"></span>Stu's Closet <button class="say big" data-say="closet" aria-label="Hear about the closet">&#128266;</button></h2>
    <div class="closet">
      <div class="mirror"><canvas id="stuPrev" width="300" height="460" aria-label="Stu wearing his outfit"></canvas>
        <div class="bank"><span class="coinI"></span><span id="bank">0</span></div>
        <button id="takeoff" class="off" hidden aria-label="Take it off">&#10006;</button></div>
      <div class="items" id="items"></div>
    </div>
  </section>
</main>
<footer>Wonder always, wander often!</footer>
<script type="module">
import { load, buy, equip } from './common/progress.js';
import { OUTFITS, drawOutfit, handMask } from './common/outfits.js';
const VO = 'rome/voice/';
let muted = false; try { muted = localStorage.getItem('stuWonderRun.mute') === '1'; } catch (e) { }
const muteB = document.getElementById('mute');
const setMuteIcon = () => { muteB.textContent = muted ? '\u{1F507}' : '\u{1F50A}'; muteB.setAttribute('aria-pressed', String(muted)); };
setMuteIcon();
muteB.onclick = () => { muted = !muted; try { localStorage.setItem('stuWonderRun.mute', muted ? '1' : '0'); } catch (e) { } setMuteIcon(); if (cur) cur.pause(); };
let cur = null;
function say(n) { if (muted || !n) return; try { if (cur) cur.pause(); cur = new Audio(VO + n + '.mp3'); cur.play().catch(() => { }); } catch (e) { } }
document.querySelectorAll('[data-say]').forEach(b => b.addEventListener('click', () => say(b.dataset.say)));
// closet
const stand = new Image(); stand.src = 'img/stu-stand.webp';
const cv = document.getElementById('stuPrev'), cx = cv.getContext('2d');
let P = load(), sel = P.equippedOutfit, tryOn = null;
const RIG = [150 - 107.1, 452 - 420];
function drawStu(c, id, t) { c.clearRect(0, 0, 300, 460); c.save(); c.translate(RIG[0], RIG[1]); drawOutfit(c, id, 'back', 0, t); c.restore(); if (stand.complete) c.drawImage(stand, 0, 0); c.save(); c.translate(RIG[0], RIG[1]); drawOutfit(c, id, 'front', 0, t); c.restore(); if (id === 'scarf' && stand.complete) { if (!handM) handM = handMask(stand, -RIG[0], -RIG[1]); c.drawImage(handM, 0, 0); } }
let handM = null;
const items = document.getElementById('items');
function icon(c, id) { // crop of Stu wearing just this item
  const off = document.createElement('canvas'); off.width = 300; off.height = 460; drawStu(off.getContext('2d'), id, 0);
  const crop = { badge: [40, 150, 170], scarf: [40, 110, 150], flag: [0, 20, 200], stars: [60, 60, 150], laurel: [40, 40, 200], feather: [0, 0, 200], cape: [20, 150, 240] }[id] || [0, 0, 300];
  const g = c.getContext('2d'); g.clearRect(0, 0, 144, 144); g.drawImage(off, crop[0], crop[1], crop[2], crop[2], 0, 0, 144, 144);
}
function render() {
  P = load();
  document.getElementById('bank').textContent = P.coins; document.getElementById('bankTop').textContent = P.coins;
  document.getElementById('takeoff').hidden = !P.equippedOutfit;
  items.innerHTML = '';
  for (const o of OUTFITS) {
    const own = P.ownedOutfits.includes(o.id), on = P.equippedOutfit === o.id;
    const b = document.createElement('div'); b.className = 'item' + (on ? ' on' : '') + (tryOn === o.id ? ' sel' : ''); b.setAttribute('role', 'button'); b.tabIndex = 0; b.setAttribute('aria-label', o.name + (own ? (on ? ', wearing' : ', yours') : ', ' + o.price + ' coins'));
    const c = document.createElement('canvas'); c.width = 144; c.height = 144; b.appendChild(c); icon(c, o.id);
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = o.name; b.appendChild(nm);
    if (own) { if (on) { const t = document.createElement('span'); t.className = 'tick'; t.textContent = '\u2714'; b.appendChild(t); } }
    else if (tryOn === o.id) { const k = document.createElement('button'); k.className = 'buy'; k.innerHTML = '<span class="coinI"></span>' + o.price; k.disabled = P.coins < o.price; k.setAttribute('aria-label', 'Buy for ' + o.price + ' coins');
      k.onclick = e => { e.stopPropagation(); if (buy(o.id, o.price)) { tryOn = null; say('looks_great'); render(); } }; b.appendChild(k); }
    else { const pr = document.createElement('span'); pr.className = 'pr'; pr.innerHTML = '<span class="coinI"></span>' + o.price; b.appendChild(pr); }
    const act = () => { if (own) { equip(on ? null : o.id); tryOn = null; if (!on) say('looks_great'); } else { tryOn = tryOn === o.id ? null : o.id; } render(); };
    b.addEventListener('click', act); b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
    items.appendChild(b);
  }
}
document.getElementById('takeoff').onclick = () => { equip(null); tryOn = null; render(); };
stand.onload = render; render();
window.addEventListener('storage', render); window.addEventListener('pageshow', render);
(function loop(ts) { drawStu(cx, tryOn || P.equippedOutfit, ts / 1000); requestAnimationFrame(loop); })(0);
</script>
</body>
</html>
